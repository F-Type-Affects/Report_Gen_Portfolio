<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Your Email</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/select_email.css') }}">
</head>
<body>
    <header>
        <h1>Select Your Email</h1>
    </header>
    
    <!-- Display Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        <p>{{ message }}</p>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    
    <div class="container">
        <form action="{{ url_for('select_email_submit') }}" method="POST">
            <label for="email">Email:</label>
            <select id="email" name="email" required>
                <option value="" disabled selected>Select your email</option>
                {% for email in emails %}
                    <option value="{{ email }}">{{ email }}</option>
                {% endfor %}
            </select>
            
            <!-- Hidden input to carry the 'next' URL -->
            <input type="hidden" name="next_url" value="{{ next_url }}">
            
            <div class="button-group">
                <button type="submit">Next</button>
                <button type="button" onclick="window.location.href='{{ url_for('home') }}'">Back</button>
            </div>
        </form>
    </div>
</body>
</html>
