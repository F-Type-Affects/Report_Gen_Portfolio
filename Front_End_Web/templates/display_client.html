<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Client</title>
    <link rel="stylesheet" href="../static/css/display_client.css">
</head>
<body>
    <header>
        <h1>Confirm Client Information</h1>
    </header>
    <div class="container">
        {% if client %}
            <table>
                <tr>
                    <th>Client ID</th>
                    <td>{{ client['id'] }}</td>
                </tr>
                <tr>
                    <th>Client Name</th>
                    <td>{{ client['name'] }}</td>
                </tr>
                <!-- Add more fields if necessary -->
            </table>
            <div class="button-group">
                <form action="/create_project/confirm_client" method="POST">
                    <!-- Hidden inputs to pass data -->
                    <input type="hidden" name="client_id" value="{{ client['id'] }}">
                    <button type="submit">Confirm Client</button>
                </form>
                <button onclick="window.location.href='/create_project/find_client'">Search Again</button>
            </div>
        {% else %}
            <p>No client found with the provided name.</p>
            <button onclick="window.location.href='/create_project/find_client'">Try Again</button>
        {% endif %}
    </div>
</body>
</html>
