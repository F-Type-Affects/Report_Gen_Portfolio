<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find AHJ & Amendments</title>
    <link rel="stylesheet" href="../static/css/fetch_ahj_address.css">
</head>
<body>
    <div class="container">
        <h2>Find AHJ & Amendments</h2>
        
        {% if project_address %}
            <!-- If project address is available, show it for confirmation -->
            <p>Confirm the address retrieved from project details:</p>
            <p><strong>{{ project_address }}</strong></p>
            <form method="POST" action="{{ url_for('find_ahj') }}">
                <input type="hidden" name="address" value="{{ project_address }}">
                <button type="submit" class="btn btn-primary">Find AHJ</button>
            </form>
        {% else %}
            <!-- If project address is not available, ask for manual entry -->
            <p>No project details found. Please enter an address to search for the AHJ:</p>
            <form method="POST" action="{{ url_for('find_ahj') }}">
                <label for="address">Enter Address:</label>
                <input type="text" id="address" name="address" placeholder="Enter Address" required>
                <button type="submit" class="btn btn-primary">Find AHJ</button>
            </form>
        {% endif %}
        
        <!-- New Button: Fetch Project Details -->
        <form method="POST" action="{{ url_for('fetch_ahj_address') }}">
            <input type="hidden" name="use_fetch_flow" value="true">
            <button type="submit" class="btn btn-secondary">Fetch Address from Project</button>
        </form>
        
        <!-- Back Button to return to the home page -->
        <a href="{{ url_for('home') }}" class="btn btn-danger">Back</a>
    </div>
</body>
</html>
