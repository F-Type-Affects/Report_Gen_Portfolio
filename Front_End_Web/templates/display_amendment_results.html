<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amendments Search Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/amendments_results.css') }}">
</head>
<body>
    <div class="container">
        <h2>Building Code Amendments</h2>

        <!-- Display PDF Results -->
        <h3>PDF Results</h3>
        <table>
            <thead>
                <tr>
                    <th>PDF Link</th>
                </tr>
            </thead>
            <tbody>
                {% for link in pdf_links %}
                    <tr>
                        <td><a href="{{ link }}" target="_blank">{{ link }}</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Display Website Results -->
        <h3>Website Results</h3>
        <table>
            <thead>
                <tr>
                    <th>Website Link</th>
                </tr>
            </thead>
            <tbody>
                {% for link in web_links %}
                    <tr>
                        <td><a href="{{ link }}" target="_blank">{{ link }}</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Form to Store Results -->
        <form method="POST" action="{{ url_for('store_amendment_results') }}">
            <button type="submit" class="confirm-btn">Confirm and Store</button>
        </form>

        <!-- Back Button -->
        <button class="back-btn" onclick="window.location.href='{{ url_for('fetch_ahj_address_get') }}'">Back</button>
    </div>
</body>
</html>
