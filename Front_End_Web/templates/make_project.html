<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Project</title>
    <link rel="stylesheet" href="../static/css/make_project.css">
</head>
<body>
    <header>
        <h1>Create New Project</h1>
    </header>
    <div class="container">
        <form action="/create_project/submit" method="POST">
            <input type="hidden" name="client_id" value="{{ session['client_id'] }}">
            <input type="hidden" name="manager_id" value="{{ session['manager_id'] }}">
            
            <label for="project_number">Project Number:</label>
            <input type="text" id="project_number" name="project_number" required>

            <label for="project_name">Project Name:</label>
            <input type="text" id="project_name" name="project_name" required>

            <label>Project Address:</label>
            <input type="text" name="street1" placeholder="Street 1">
            <input type="text" name="street2" placeholder="Street 2">
            <input type="text" name="city" placeholder="City" required>
            <input type="text" name="state" placeholder="State" required>
            <input type="text" name="zip" placeholder="ZIP Code" required>

            <label for="project_type">Project Type:</label>
            <input type="text" id="project_type" name="project_type">

            <label for="contract_type">Contract Type:</label>
            <input type="text" id="contract_type" name="contract_type">

            <label>Billing Contact Info:</label>
            <input type="text" name="phone_number" placeholder="Phone Number" required>
            <input type="email" name="email" placeholder="Email" required>

            <button type="submit">Create Project</button>
        </form>
    </div>
</body>
</html>
