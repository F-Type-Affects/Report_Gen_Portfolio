<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select User Email</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/select_user_email.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash_message.css') }}">
</head>
<body>
    {% include 'flash_message.html' %}
    <header>
        <h1>Select Your Email</h1>
    </header>
    
    <div class="container">
        <form action="{{ url_for('select_user_email_post') }}" method="POST">
            <label for="email">Email:</label>
            <select id="email" name="email" required>
                {% for email in emails %}
                    <option value="{{ email }}">{{ email }}</option>
                {% endfor %}
            </select>

            <!-- Hidden input to carry the next step's URL -->
            <input type="hidden" name="next_url" value="{{ next_url }}">

            <button type="submit">Next</button>
            <button type="button" onclick="window.location.href='/'">Back</button>
        </form>
    </div>
</body>
</html>
