<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select User Email</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/select_user_email.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash_message.css') }}">
</head>
<body>
    {% include 'flash_message.html' %}
    
    <div class="page-container">
        <header class="page-header">
            <h1>Select Your Email</h1>
        </header>
        
        <div class="container">
            <form action="{{ url_for('select_user_email_post') }}" method="POST" class="email-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <select id="email" name="email" class="email-select" required>
                        {% for email in emails %}
                            <option value="{{ email }}">{{ email }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Hidden input to carry the next step's URL -->
                <input type="hidden" name="next_url" value="{{ next_url }}">

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Next</button>
                    <button type="button" onclick="window.location.href='/'" class="btn btn-secondary">Back</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
